<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 科学计算</title>
  <link rel="stylesheet" href="//unpkg.com/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Python 科学计算',
      nameLink: '/',
      repo: 'https://github.com/huahbo/python_computing',
      loadSidebar: true,
      search: 'auto',
      maxLevel: 3,
      auto2top: true,
      coverpage: false,
      relativePath: false,
      katex: {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
        ]
      }
    };
  </script>
  <script src="//unpkg.com/docsify@4/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify@4/lib/plugins/emoji.min.js"></script>
  <script src="https://jsd.one/https://cdn.jsdelivr.net/npm/upupming/docsify-katex@1.4.1/dist/docsify-katex.js"></script>
</body>
</html>
